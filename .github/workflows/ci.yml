name: ci
on:
  push:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --workspace
      - name: command latency
        run: cargo test --locked --release -p wl --test latency -- --ignored --nocapture
      - name: busiest processes
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Process | Sort-Object CPU -Descending | Select-Object -First 12 Name, CPU, Id | Format-Table -AutoSize
      - name: release build
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p wl
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: wl-windows-x64
          path: target/release/wl.exe
